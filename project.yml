name: PumaWorkspace
options:
  minimumXcodeGenVersion: 2.46.0
  createIntermediateGroups: true
  generateEmptyDirectories: true
  deploymentTarget:
    iOS: "26.0"
fileGroups:
  - PumaWorkspace
  - README.md
  - AGENTS.md
  - docs
  - Tests
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  PumaWorkspace:
    type: application
    platform: iOS
    sources:
      - path: PumaWorkspace
        excludes:
          - "**/.gitkeep"
          - "**/*.md"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.knnymrls.PumaWorkspace
        PRODUCT_NAME: PumaWorkspace
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Puma Workspace
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: Show your recent photos so you can add them to a chat.
        INFOPLIST_KEY_NSCameraUsageDescription: Take a photo to add it to your chat.
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
schemes:
  PumaWorkspace:
    build:
      targets:
        PumaWorkspace: all
    run:
      config: Debug
    archive:
      config: Release
