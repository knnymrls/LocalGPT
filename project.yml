name: PumaWorkspace
options:
  minimumXcodeGenVersion: 2.46.0
  createIntermediateGroups: true
  generateEmptyDirectories: true
  deploymentTarget:
    iOS: "26.0"
fileGroups:
  - PumaWorkspace
  - README.md
  - AGENTS.md
  - docs
  - Tests
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift.git
    from: 7.0.0
  WhisperKit:
    url: https://github.com/argmaxinc/WhisperKit.git
    exactVersion: 0.15.0
targets:
  PumaWorkspace:
    type: application
    platform: iOS
    sources:
      - path: PumaWorkspace
        excludes:
          - "**/.gitkeep"
          - "**/*.md"
    dependencies:
      - package: GRDB
      - package: WhisperKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.knnymrls.PumaWorkspace
        PRODUCT_NAME: PumaWorkspace
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: LocalGPT
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: Show your recent photos so you can add them to a chat.
        INFOPLIST_KEY_NSCameraUsageDescription: Take a photo to add it to your chat.
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Transcribe your speech on this device for dictation and voice conversations.
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: Recognize speech on this device.
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
  PumaWorkspaceTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests/Unit
    dependencies:
      - target: PumaWorkspace
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.knnymrls.PumaWorkspaceTests
        GENERATE_INFOPLIST_FILE: YES
  PumaWorkspaceLiveTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests/Live
    dependencies:
      - target: PumaWorkspace
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.knnymrls.PumaWorkspaceLiveTests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  PumaWorkspace:
    build:
      targets:
        PumaWorkspace: all
    run:
      config: Debug
    test:
      targets:
        - PumaWorkspaceTests
    archive:
      config: Release
  PumaWorkspaceLiveChecks:
    build:
      targets:
        PumaWorkspace: all
    test:
      targets:
        - PumaWorkspaceLiveTests
